<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Coffee House!</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <header>
        <div class="center">
            <div class="logo"><img src="imagens/pngwing.com.png" width="220" alt="Caribe's Coffee Logo"></div><!--logo-->
            <div class="menu">
                <a href="#">Home</a>
                <a href="#">Menu</a>
                <a href="#">What's New</a>
                <a href="#">Contact Us</a>
            </div><!--menu-->
        </div><!--center-->
    </header>
    <section class="sobre">
        <div class="extras">
            <img src="imagens/cafe1.png" alt="Coffee Mocaccino Image" width="450" title="Mocaccino photo">
            <div class="social-media">
                <a href=""><img src="imagens/facebooklogo.png" alt="Facebook" width="30" title="Facebook"></a>
                <a href=""><img src="imagens/instagramlogo.png" alt="Instagram" width="30" title="Instagram"></a>
                <a href=""><img src="imagens/twitterlogo.png" alt="Twitter" width="30" title="Twitter"></a>
            </div>
        </div><!--extras-->
        <div class="center">
            <div class="texto-sobre">
                <h1>Experience the Perfect <spam style="color: #6f4e37;">Cup of Coffee!</spam></h1>
                <p>It's not just a coffee shop, it's a experience.
                <br>Come here to drink the best coffee in town!</p>
                <button>Learn More</button>
            </div><!--texto-sobre-->
    </section>
</body>
</html>
